<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ödeme</title>

<style>
body{font-family:Arial;padding:10px;background:#f4f6f8}

input,textarea{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<h2>Ödeme</h2>

<input id="name" placeholder="Ad Soyad">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefon">
<textarea id="address" placeholder="Adres"></textarea>

<button onclick="send()">Sipariş Gönder</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function send(){

let items = cart.map(p=>{
return `- ${p.name} | ${p.price} TL`;
}).join("\n");

let total = cart.reduce((a,b)=>a+Number(b.price),0);

let subject = "Yeni Sipariş";
let body =
`Ad: ${name.value}
Email: ${email.value}
Telefon: ${phone.value}
Adres: ${address.value}

ÜRÜNLER:
${items}

TOPLAM: ${total}`;

let mail = `mailto:YOURMAIL@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

localStorage.removeItem("cart");

location.href = mail;
}
</script>

</body>
</html>
