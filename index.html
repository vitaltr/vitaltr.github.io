<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOP PRO</title>

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}

body{
margin:0;
background:#f6f6f6;
color:#111;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 14px;
background:#fff;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:10;
}

.logo{font-weight:700}
.logo span{color:#007aff}

/* CATEGORY */
.nav{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px;
background:#fff;
border-bottom:1px solid #eee;
}

.nav button{
white-space:nowrap;
border:none;
background:#f1f1f1;
padding:6px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
}

.nav button.active{
background:#007aff;
color:#fff;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
padding:10px;
}

/* MOBİL */
@media(max-width:768px){
.container{
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}
}

/* CARD */
.card{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.card img{
width:100%;
height:140px;
object-fit:cover;
}

.body{padding:8px}

.title{
font-size:13px;
font-weight:600;
margin:0;
}

.desc{
font-size:11px;
color:#666;
margin:4px 0;
}

.price{
font-size:13px;
font-weight:700;
color:#1a7f37;
margin-top:4px;
}

.btn{
width:100%;
border:none;
padding:7px;
border-radius:10px;
font-size:12px;
margin-top:6px;
cursor:pointer;
}

.cart{
background:#007aff;
color:#fff;
}
</style>
</head>

<body>

<header>
<div class="logo">VITAL<span>SHOP</span></div>
<button onclick="location.href='cart.html'">🛒</button>
</header>

<div class="nav" id="nav"></div>
<div class="container" id="products"></div>

<script>

let store = JSON.parse(localStorage.getItem("store")) || {
categories:[
{
name:"Genel",
products:[
{
id:1,
name:"Mouse",
price:199,
img:"1.jpg",
desc:"Gaming mouse",
stock:5
},
{
id:2,
name:"Keyboard",
price:399,
img:"2.jpg",
desc:"Mechanical",
stock:3
}
]
}
]
};

let active = 0;
let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* NAV */
function renderNav(){
let nav = document.getElementById("nav");
nav.innerHTML="";

store.categories.forEach((c,i)=>{
nav.innerHTML += `
<button class="${i===active?'active':''}" onclick="openCat(${i})">
${c.name}
</button>`;
});
}

function openCat(i){
active=i;
render();
renderNav();
}

/* PRODUCTS */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

let cat = store.categories[active];

if(!cat || !cat.products.length){
box.innerHTML="<p style='padding:10px'>Ürün yok</p>";
return;
}

cat.products.forEach(p=>{

let img = p.img.startsWith("http") ? p.img : "images/"+p.img;

box.innerHTML += `
<div class="card">
<img src="${img}">
<div class="body">
<div class="title">${p.name}</div>
<div class="desc">${p.desc}</div>
<div class="price">${p.price} TL</div>

<button class="btn cart" onclick="add(${p.id})">
Sepete Ekle
</button>

</div>
</div>
`;
});
}

/* CART */
function add(id){
store.categories.forEach(c=>{
c.products.forEach(p=>{
if(p.id===id){
cart.push(p);
localStorage.setItem("cart",JSON.stringify(cart));
alert("Eklendi");
}
});
});
}

renderNav();
render();

</script>

</body>
</html>
