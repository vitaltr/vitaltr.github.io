<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SHOP</title>

<style>
body{margin:0;font-family:Arial;background:#f3f5f7}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#111;
color:white;
position:sticky;
top:0;
}

.logo span{color:#00d4ff}

.nav{display:flex;gap:8px;flex-wrap:wrap}

.nav button{
background:#222;
color:white;
border:none;
padding:6px 10px;
border-radius:20px;
cursor:pointer;
}

.nav button.active{background:#00d4ff;color:#000}

/* BUTTONS TOP RIGHT */
.right{
display:flex;
gap:8px;
}

/* SEARCH */
input{
width:100%;
padding:10px;
border:none;
outline:none;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.body{padding:10px}

.price{color:green;font-weight:bold}

button{
padding:6px;
border:none;
cursor:pointer;
border-radius:6px;
}

.cartbtn{background:#00d4ff}
.favbtn{background:#ff4d6d;color:white}
</style>
</head>

<body>

<header>
<div class="logo">VITAL<span>SHOP</span></div>

<div class="right">
<button onclick="location.href='cart.html'">🛒 Sepet</button>
</div>
</header>

<input id="search" oninput="search()" placeholder="Ürün ara">

<div class="nav" id="nav"></div>

<div class="container" id="products"></div>

<script>
let store = JSON.parse(localStorage.getItem("store")) || {categories:[]};
let active=0;

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let fav = JSON.parse(localStorage.getItem("fav")) || [];

/* NAV */
function renderNav(){
let nav=document.getElementById("nav");
nav.innerHTML="";

store.categories.forEach((c,i)=>{
nav.innerHTML+=`
<button class="${i===active?'active':''}" onclick="openCat(${i})">
${c.name}
</button>`;
});
}

function openCat(i){
active=i;
render();
renderNav();
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

if(!store.categories.length) return;

let cat = store.categories[active];

cat.products.forEach(p=>{

let img = p.img.includes("http") ? p.img : "images/"+p.img;

box.innerHTML+=`
<div class="card">
<img src="${img}">
<div class="body">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div>Stok: ${p.stock}</div>
<div class="price">${p.price} TL</div>

<button class="cartbtn" onclick="addCart(${p.id})">Sepete Ekle</button>
<button class="favbtn" onclick="toggleFav(${p.id})">❤️</button>
</div>
</div>
`;
});
}

/* SEPET */
function addCart(id){
store.categories.forEach(c=>{
c.products.forEach(p=>{
if(p.id===id){
if(p.stock<=0){alert("Stok yok");return;}
cart.push(p);
localStorage.setItem("cart",JSON.stringify(cart));
alert("Sepete eklendi");
}
});
});
}

/* FAVORİ */
function toggleFav(id){
let exists = fav.find(x=>x.id===id);

if(exists){
fav = fav.filter(x=>x.id!==id);
}else{
store.categories.forEach(c=>{
c.products.forEach(p=>{
if(p.id===id) fav.push(p);
});
});
}

localStorage.setItem("fav",JSON.stringify(fav));
}

/* SEARCH */
function search(){
let val = search.value.toLowerCase();
let cat = store.categories[active];

let filtered = cat.products.filter(p=>
p.name.toLowerCase().includes(val)
);

let box=document.getElementById("products");
box.innerHTML="";

filtered.forEach(p=>{
box.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
</div>`;
});
}

renderNav();
render();
</script>

</body>
</html>
