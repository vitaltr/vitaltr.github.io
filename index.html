}

function logoUrl() { return 'https://vitaltr.github.io/images/logo.png'; }

// KATEGORİLERİ YÜKLE
const kq = query(collection(db, 'categories'), orderBy('createdAt', 'asc'));
onSnapshot(kq, (snapshot) => {
kategoriler = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
renderKategoriler();
}, (error) => {
console.error('Kategori hatası:', error);
});

// ÜRÜNLERİ YÜKLE
const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
onSnapshot(q, (snapshot) => {
urunler = snapshot.docs.map((d) => {
const p = d.data();
return {
id: d.id,
ad: p.name || 'İsimsiz',
fiyat: Number(p.price) || 0,
aciklama: p.description || '',
img: p.image || logoUrl(),
kategori: p.category || 'diger',
badge: p.tag || '',
badgeClass: badgeClass(p.tag),
variants: p.variants || []
};
});
renderUrunler();
sepetGuncelle();
}, (error) => {
document.getElementById('urun-listesi').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#dc2626">⚠️ Ürünler yüklenemedi: ${error.message}</div>`;
});

function renderKategoriler() {
const container = document.getElementById('kategoriler');
container.innerHTML = `<button class="kategori-btn ${aktifKategori === 'tum' ? 'aktif' : ''}" onclick="filtrele('tum',this)">🏠 Tümü</button>`;
kategoriler.forEach(k => {
const btn = document.createElement('button');
btn.className = 'kategori-btn' + (aktifKategori === k.slug ? ' aktif' : '');
btn.innerHTML = `${k.ikon || '📦'} ${k.ad}`;
btn.onclick = function() { filtrele(k.slug, this); };
container.appendChild(btn);
});
}

function showToast(msg, renk = 'blue') {
const t = document.getElementById('toast');
t.textContent = msg;
const renkler = { blue: '#2563eb', green: '#10b981', red: '#dc2626', orange: '#f59e0b', gray: '#64748b' };
t.style.background = renkler[renk] || renkler.blue;
t.classList.add('show');
clearTimeout(t._timer);
t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function filtrele(kat, btn) {
aktifKategori = kat;
document.querySelectorAll('.kategori-btn').forEach(b => b.classList.remove('aktif'));
if (btn) btn.classList.add('aktif');
renderUrunler();
}
window.filtrele = filtrele;

function renderUrunler() {
const container = document.getElementById('urun-listesi');
if (urunler.length === 0) {
container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#94a3b8"><div style="font-size:60px;margin-bottom:16px">📦</div><p style="font-size:16px;font-weight:600;color:#64748b">Henüz ürün eklenmemiş</p></div>`;
return;
}
const filtered = aktifKategori === 'tum' ? urunler : urunler.filter(u => u.kategori === aktifKategori);
if (filtered.length === 0) {
container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#94a3b8"><div style="font-size:60px;margin-bottom:16px">🔍</div><p style="font-size:16px;font-weight:600;color:#64748b">Bu kategoride ürün yok</p></div>`;
return;
}
container.innerHTML = filtered.map((u, i) => {
const realIdx = urunler.indexOf(u);
const sepette = sepet.find(s => s.id === u.id);
const adet = sepette ? sepette.adet : 0;
const bc = u.badgeClass ? `badge ${u.badgeClass}` : 'badge';
return `
<div class="product-card fade-in-up" onclick="detayAc(${realIdx})" style="animation-delay:${i*.05}s">
<div class="image-wrapper">
<img src="${u.img}" alt="${u.ad}" loading="lazy" onerror="this.onerror=null;this.src='${logoUrl()}'">
${u.badge ? `<span class="${bc}">${u.badge}</span>` : ''}
${adet > 0 ? `<div class="adet-badge">${adet} adet</div>` : ''}
</div>
<div class="product-info">
<h3>${u.ad}</h3>
<p class="aciklama">${u.aciklama}</p>
<div class="alt">
<span class="fiyat">${u.fiyat} TL</span>
<span class="kategori-etiket">${u.kategori}</span>
</div>
</div>
</div>
`;
}).join('');
}
window.renderUrunler = renderUrunler;

function detayAc(index) {
const u = urunler[index];
if (!u) return;
modalData.index = index;
modalData.adet = 1;
modalData.variant = 0;

document.getElementById('modal-title').textContent = u.ad;
document.getElementById('modal-desc').textContent = u.aciklama || 'Açıklama yok';
document.getElementById('modal-img').src = u.img;

const badgeEl = document.getElementById('modal-badge');
if (u.badge) {
badgeEl.textContent = u.badge;
badgeEl.className = 'modal-badge-overlay ' + (u.badgeClass || '');
badgeEl.style.display = 'block';
} else {
badgeEl.style.display = 'none';
}

const vSec = document.getElementById('variants-section');
const vList = document.getElementById('variants-list');
if (u.variants && u.variants.length > 0) {
vSec.style.display = 'block';
vList.innerHTML = u.variants.map((v, i) => {
const sel = i === 0 ? 'selected' : '';
const fg = v.fark > 0 ? `+${v.fark} TL` : 'Standart';
return `<div class="variant-option ${sel}" onclick="variantSec(${i})"><div class="v-name">${v.ad}</div><div class="v-price">${fg}</div></div>`;
}).join('');
} else {
vSec.style.display = 'none';
vList.innerHTML = '';
}

const ekF = u.variants && u.variants.length > 0 ? (Number(u.variants[0].fark) || 0) : 0;
document.getElementById('modal-fiyat').textContent = (u.fiyat + ekF) + ' TL';
document.getElementById('modal-adet').textContent = '1';
document.getElementById('modal-note').value = '';
document.getElementById('note-counter').textContent = '0 / 200';
document.getElementById('note-counter').className = 'note-counter';

document.getElementById('product-modal').classList.add('show');
document.getElementById('product-sheet').classList.add('show');
document.body.style.overflow = 'hidden';
}
window.detayAc = detayAc;

function variantSec(idx) {
const u = urunler[modalData.index];
if (!u || !u.variants) return;
modalData.variant = idx;
document.querySelectorAll('#variants-list .variant-option').forEach((el, i) => el.classList.toggle('selected', i === idx));
const v = u.variants[idx];
const ekF = Number(v.fark) || 0;
document.getElementById('modal-fiyat').textContent = ((u.fiyat + ekF) * modalData.adet) + ' TL';
document.getElementById('modal-img').src = v.img ? v.img : u.img;
}
window.variantSec = variantSec;

document.getElementById('modal-note').addEventListener('input', (e) => {
const len = e.target.value.length;
const c = document.getElementById('note-counter');
c.textContent = `${len} / 200`;
c.className = len > 180 ? 'note-counter warning' : 'note-counter';
});

function adetDegistir(d) {
modalData.adet = Math.max(1, modalData.adet + d);
document.getElementById('modal-adet').textContent = modalData.adet;
const u = urunler[modalData.index];
if (!u) return;
let ekF = 0;
if (u.variants && u.variants.length > 0) {
const v = u.variants[modalData.variant] || u.variants[0];
ekF = Number(v.fark) || 0;
}
document.getElementById('modal-fiyat').textContent = ((u.fiyat + ekF) * modalData.adet) + ' TL';
}
window.adetDegistir = adetDegistir;

function sepeteEkle() {
const u = urunler[modalData.index];
if (!u) return;
const note = document.getElementById('modal-note').value.trim();
let vAdi = '';
let ekF = 0;
let vImg = u.img;
if (u.variants && u.variants.length > 0) {
const v = u.variants[modalData.variant] || u.variants[0];
vAdi = v.ad;
ekF = Number(v.fark) || 0;
if (v.img) vImg = v.img;
}
const toplam = u.fiyat + ekF;
const varOlan = sepet.find(item => item.id === u.id && item.variant === vAdi && item.note === note);
if (varOlan) {
varOlan.adet += modalData.adet;
} else {
sepet.push({ id: u.id, ad: u.ad, fiyat: toplam, kategori: u.kategori, adet: modalData.adet, img: vImg, note, variant: vAdi });
}
const mesaj = vAdi ? `${u.ad} (${vAdi}) sepete eklendi` : `${u.ad} sepete eklendi`;
showToast('✅ ' + mesaj, 'green');
kapatDetay();
sepetGuncelle();
}
window.sepeteEkle = sepeteEkle;

function kapatDetay() {
document.getElementById('product-modal').classList.remove('show');
document.getElementById('product-sheet').classList.remove('show');
document.body.style.overflow = '';
}
window.kapatDetay = kapatDetay;

function kapatSepet() {
document.getElementById('sepet-modal').classList.remove('show');
document.getElementById('sepet-sheet').classList.remove('show');
document.body.style.overflow = '';
}
window.kapatSepet = kapatSepet;

function sepeteGit() {
const sm = document.getElementById('sepet-modal');
const ss = document.getElementById('sepet-sheet');
if (ss.classList.contains('show')) {
kapatSepet();
} else {
sm.classList.add('show');
ss.classList.add('show');
sepetGuncelle();
document.body.style.overflow = 'hidden';
}
}
window.sepeteGit = sepeteGit;

function sepettenCikar(idx) {
const item = sepet[idx];
if (item.adet > 1) {
item.adet -= 1;
showToast('➖ ' + item.ad + ' azaltıldı', 'orange');
} else {
sepet.splice(idx, 1);
showToast('❌ ' + item.ad + ' çıkarıldı', 'red');
}
sepetGuncelle();
}
window.sepettenCikar = sepettenCikar;

function sepeteHizliEkle(idx) {
const item = sepet[idx];
item.adet += 1;
sepetGuncelle();
}
window.sepeteHizliEkle = sepeteHizliEkle;

function sepetiTemizle() {
if (sepet.length === 0) { showToast('🤷 Zaten boş', 'gray'); return; }
sepet = [];
siparisKaydedildi = false;
siparisNo = '';
showToast('🗑️ Sepet temizlendi', 'red');
sepetGuncelle();
}
window.sepetiTemizle = sepetiTemizle;

function sepetGuncelle() {
const toplamF = sepet.reduce((s, i) => s + i.fiyat * i.adet, 0);
const toplamA = sepet.reduce((s, i) => s + i.adet, 0);

document.getElementById('header-total').textContent = toplamF + ' TL';
document.getElementById('sepet-ozet').textContent = sepet.length > 0 ? `${sepet.length} ürün` : 'Sepet boş';
document.getElementById('sepet-adet').textContent = `${toplamA} ürün`;
document.getElementById('sepet-toplam').textContent = toplamF + ' TL';
document.getElementById('sepet-toplam-modal').textContent = toplamF + ' TL';

const badge = document.getElementById('cart-count');
const badgeM = document.getElementById('cart-count-mobil');
const goster = toplamA > 0 ? (toplamA > 9 ? '9+' : toplamA) : '0';
if (toplamA > 0) {
badge.classList.add('show');
badge.textContent = goster;
badgeM.textContent = goster;
} else {
badge.classList.remove('show');
badgeM.textContent = '0';
}

const liste = document.getElementById('sepet-listesi');
document.getElementById('sepet-baslik-adet').textContent = `(${toplamA})`;

if (sepet.length === 0) {
liste.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:40px 20px"><div style="font-size:60px;margin-bottom:12px">🛒</div><p style="font-weight:600;color:#64748b">Sepetiniz boş</p></div>`;
} else {
liste.innerHTML = sepet.map((item, i) => `
<div class="sepet-item">
<img src="${item.img}" onerror="this.onerror=null;this.src='${logoUrl()}'">
<div class="bilgi">
<h4>${item.ad}</h4>
${item.variant ? `<div class="varyant">🎨 ${item.variant}</div>` : ''}
${item.note ? `<div class="not">📝 ${item.note}</div>` : ''}
</div>
<div class="sag">
<div class="adet-ctrl">
<button class="minus" onclick="sepettenCikar(${i})">−</button>
<span style="font-weight:700;font-size:14px;min-width:20px;text-align:center">${item.adet}</span>
<button class="plus" onclick="sepeteHizliEkle(${i})">+</button>
</div>
<span class="fiyat-sag">${item.fiyat * item.adet} TL</span>
</div>
</div>
`).join('');
}
renderUrunler();
}
window.sepetGuncelle = sepetGuncelle;

function siparisNoUret() {
const d = new Date();
const y = d.getFullYear();
const m = String(d.getMonth() + 1).padStart(2, '0');
const dd = String(d.getDate()).padStart(2, '0');
const r = Math.floor(Math.random() * 9000 + 1000);
return `#${y}${m}${dd}-${r}`;
}

async function pdfIndir() {
if (sepet.length === 0) { showToast('😊 Sepet boş!', 'red'); return; }

if (siparisKaydedildi) {
showToast('⚠️ Bu sipariş zaten kaydedildi. Yeni sipariş için sepeti temizleyin veya sayfayı yenileyin.', 'orange');
return;
}

const pdfBtn = document.getElementById('pdf-btn');
if (pdfBtn) { pdfBtn.disabled = true; pdfBtn.style.opacity = '0.5'; pdfBtn.style.cursor = 'not-allowed'; }

const mAd = document.getElementById('m-ad').value.trim();
const mTel = document.getElementById('m-tel').value.trim();
const mSehir = document.getElementById('m-sehir').value.trim();
const mIlce = document.getElementById('m-ilce').value.trim();
const mPosta = document.getElementById('m-posta').value.trim();
const mEmail = document.getElementById('m-email').value.trim();
const mAdres = document.getElementById('m-adres').value.trim();

siparisNo = siparisNoUret();
showToast('⏳ PDF hazırlanıyor...', 'blue');

const toplamF = sepet.reduce((s, i) => s + i.fiyat * i.adet, 0);
const tarih = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

const musteriSatirlari = [];
if (mAd) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">Ad Soyad:</span><span style="font-weight:600;color:#1e293b">${mAd}</span></div>`);
if (mTel) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">Telefon:</span><span style="font-weight:600;color:#1e293b">${mTel}</span></div>`);
if (mEmail) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">E-posta:</span><span style="font-weight:600;color:#1e293b">${mEmail}</span></div>`);
if (mAdres) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">Adres:</span><span style="font-weight:600;color:#1e293b">${mAdres}</span></div>`);
if (mSehir) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">Şehir:</span><span style="font-weight:600;color:#1e293b">${mSehir}</span></div>`);
if (mIlce) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">İlçe:</span><span style="font-weight:600;color:#1e293b">${mIlce}</span></div>`);
if (mPosta) musteriSatirlari.push(`<div style="display:flex;padding:4px 0"><span style="color:#64748b;width:120px">Posta Kodu:</span><span style="font-weight:600;color:#1e293b">${mPosta}</span></div>`);

const musteriHTML = musteriSatirlari.length > 0
? `<div style="background:#f8fafc;padding:16px;border-radius:12px;margin-bottom:20px"><h3 style="font-size:14px;font-weight:700;color:#334155;margin-bottom:10px">👤 MÜŞTERİ BİLGİLERİ</h3>${musteriSatirlari.join('')}</div>`
: '';

const content = document.createElement('div');
content.style.padding = '30px';
content.style.fontFamily = 'Arial, sans-serif';
content.style.background = '#ffffff';
content.style.color = '#1e293b';
content.innerHTML = `
<div style="text-align:center;margin-bottom:24px;border-bottom:3px solid #2563eb;padding-bottom:16px">
<h1 style="color:#1e293b;font-size:28px;font-weight:800;margin-bottom:4px">VITAL<span style="color:#2563eb">SHOP</span></h1>
<p style="color:#64748b;font-size:12px">Premium Electronics</p>
<div style="margin-top:12px;display:flex;justify-content:space-between;font-size:12px;color:#64748b">
<span>Sipariş No: <b style="color:#1e293b">${siparisNo}</b></span>
<span>${tarih}</span>
</div>
</div>
${musteriHTML}
<h3 style="font-size:14px;font-weight:700;color:#334155;margin-bottom:10px">📦 SİPARİŞ İÇERİĞİ</h3>
${sepet.map((item, i) => `
<div style="padding:12px 0;border-bottom:1px solid #f1f5f9">
<div style="display:flex;justify-content:space-between">
<div style="font-weight:600;font-size:14px;color:#1e293b">${i+1}. ${item.ad}</div>
<span style="font-weight:700;font-size:15px;color:#2563eb">${item.fiyat * item.adet} TL</span>
</div>
<div style="font-size:12px;color:#64748b;margin-top:2px">Adet: ${item.adet}${item.variant ? ' • 🎨 ' + item.variant : ''}</div>
${item.note ? `<div style="font-size:12px;color:#d97706;background:#fffbeb;padding:6px 10px;border-radius:6px;margin-top:6px">📝 Not: ${item.note}</div>` : ''}
</div>
`).join('')}
<div style="display:flex;justify-content:space-between;padding:16px 0;margin-top:12px;border-top:2px solid #1e293b">
<span style="font-size:16px;font-weight:700">TOPLAM</span>
<span style="font-size:22px;font-weight:800;color:#2563eb">${toplamF} TL</span>
</div>
<div style="margin-top:30px;color:#94a3b8;font-size:11px;text-align:center;border-top:1px solid #e5e7eb;padding-top:20px">
Teşekkür ederiz! 🙏<br>VITALSHOP - Premium Electronics
</div>
`;

try {
await addDoc(collection(db, 'orders'), {
siparisNo: siparisNo,
tarih: new Date().toISOString(),
musteri: { ad: mAd, tel: mTel, email: mEmail, adres: mAdres, sehir: mSehir, ilce: mIlce, posta: mPosta },
urunler: sepet.map(item => ({ ad: item.ad, fiyat: item.fiyat, adet: item.adet, variant: item.variant || '', note: item.note || '', img: item.img || '' })),
toplam: toplamF,
durum: 'yeni',
createdAt: serverTimestamp()
});
siparisKaydedildi = true;
console.log('✅ Sipariş kaydedildi:', siparisNo);
setTimeout(() => {
sepet = [];
siparisKaydedildi = false;
siparisNo = '';
sepetGuncelle();
showToast('🛒 Sepet boşaltıldı. Yeni sipariş verebilirsiniz.', 'green');
}, 2000);
} catch (err) {
console.error('❌ Sipariş kayıt hatası:', err);
showToast('⚠️ Sipariş kaydedilemedi ama PDF indirilecek', 'orange');
}

html2pdf().set({
margin: 15,
filename: `vital-shop-${siparisNo.replace('#','')}.pdf`,
image: { type: 'jpeg', quality: 0.98 },
html2canvas: { scale: 2, backgroundColor: '#ffffff' },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
}).from(content).save()
.then(() => {
showToast('📄 PDF indirildi', 'green');
})
.catch((err) => {
showToast('❌ PDF hatası: ' + err.message, 'red');
})
.finally(() => {
if (pdfBtn) { pdfBtn.disabled = false; pdfBtn.style.opacity = '1'; pdfBtn.style.cursor = 'pointer'; }
});
}
window.pdfIndir = pdfIndir;

document.addEventListener('keydown', (e) => {
if (e.key === 'Escape') { kapatDetay(); kapatSepet(); }
});
</script>
</body>
</html>
