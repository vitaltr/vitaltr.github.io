<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PRO SHOP</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
header{
display:flex;justify-content:space-between;align-items:center;
padding:15px;background:#111;color:#fff
}

.menu button{
margin:3px;padding:8px 12px;border:none;
border-radius:6px;cursor:pointer;
background:#333;color:#fff
}
.menu button:hover{background:#00bcd4}

.product{
display:flex;gap:15px;
background:#fff;margin:12px;padding:15px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1)
}

.product img{
width:150px;border-radius:10px
}

.right{flex:1}

.title{font-size:18px;font-weight:bold}
.desc{font-size:13px;color:#555;margin:5px 0}

.badge{
display:inline-block;
padding:4px 8px;
background:#eee;
border-radius:5px;
font-size:12px
}

input,select{
width:100%;
margin-top:6px;
padding:7px;
border-radius:6px;
border:1px solid #ccc
}

.btn{
margin-top:8px;
padding:10px;
width:100%;
border:none;
border-radius:8px;
cursor:pointer;
background:#00bcd4;
color:#fff;
font-weight:bold
}

.btn:hover{background:#0097a7}

.cart{
background:#00d4ff;padding:5px 10px;border-radius:5px;color:#000
}

.order{
position:fixed;bottom:20px;right:20px;
background:green;color:#fff;
padding:15px;border:none;border-radius:30px;cursor:pointer
}
</style>
</head>

<body>

<header>
<div><b>SHOP PRO</b></div>
<div class="menu" id="menu"></div>
<div class="cart">🛒 <span id="cartCount">0</span></div>
</header>

<main id="app"></main>

<button class="order" onclick="sendOrder()">Sipariş</button>

<script src="shop.js"></script>
</body>
</html>
