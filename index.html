<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITAL SHOP PRO - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a202c;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen font-sans">

    <!-- Başlık -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 shadow-lg text-center">
        <h1 class="text-3xl font-bold">🛒 VITAL SHOP PRO</h1>
        <p class="text-sm opacity-90">Hızlı Sipariş ve Teklif Sistemi</p>
    </header>

    <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
        <!-- Ürün Listesi -->
        <div class="lg:col-span-2 space-y-4">
            <h2 class="text-xl font-semibold text-gray-700 border-b-2 border-blue-500 pb-2 flex items-center gap-2">
                <span>📦</span> Ürünlerimiz
            </h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="urun-listesi">
                <!-- Ürünler JavaScript ile eklenecek -->
            </div>
        </div>

        <!-- Sepet -->
        <div class="bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-xl border border-gray-200 h-fit sticky top-4">
            <h2 class="text-xl font-semibold border-b pb-2 mb-4 flex justify-between items-center">
                <span>🛍️ Sepetiniz</span>
                <button id="temizle-btn" class="text-xs text-red-500 hover:text-red-700 font-medium transition">🗑️ Temizle</button>
            </h2>
            
            <div id="fatura-alani">
                <div id="sepet-bos-uyari" class="text-gray-400 text-sm py-8 text-center">
                    <span class="text-4xl block mb-2">🛒</span>
                    Sepetiniz boş
                </div>
                <ul id="sepet-listesi" class="space-y-3 text-sm"></ul>
                
                <div class="border-t-2 mt-4 pt-3 flex justify-between items-center font-bold text-gray-800">
                    <span class="text-lg">Toplam:</span>
                    <span id="sepet-toplam" class="text-xl text-blue-600">0 TL</span>
                </div>
            </div>

            <div class="space-y-2 mt-4">
                <button id="pdf-btn" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
                    📄 PDF İndir
                </button>
                <button id="hizli-ekle-btn" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-2 rounded-lg font-semibold hover:shadow-lg transition-all text-sm">
                    ⚡ Hızlı Demo Ekle
                </button>
            </div>
        </div>
    </main>

    <!-- Toast bildirim -->
    <div id="toast" class="toast hidden"></div>

    <script>
        // Ürün verileri
        const urunler = [
            { id: 1, ad: 'PCB Kart Tipi A', fiyat: 100, aciklama: 'FR4 çift katmanlı PCB', icon: '🔌', 
              ozellikler: ['Tek Katman', 'Çift Katman (+50 TL)', '4 Katman (+150 TL)'] },
            { id: 2, ad: 'Pleksi Etiket', fiyat: 45, aciklama: 'Lazer kesim endüstriyel etiket', icon: '🏷️',
              ozellikler: ['3mm Siyah', '3mm Şeffaf', '5mm Beyaz (+30 TL)'] },
            { id: 3, ad: 'LED Gösterge', fiyat: 25, aciklama: 'RGB LED panel gösterge', icon: '💡',
              ozellikler: ['Kırmızı', 'Yeşil', 'Mavi (+10 TL)'] },
            { id: 4, ad: 'Kablo Demeti', fiyat: 60, aciklama: '10'lu jumper kablo seti', icon: '🔗',
              ozellikler: ['10cm', '20cm (+15 TL)', '30cm (+25 TL)'] }
        ];

        let sepet = [];

        // Toast mesajı
        function showToast(mesaj, renk = 'blue') {
            const toast = document.getElementById('toast');
            toast.textContent = mesaj;
            toast.className = `toast bg-${renk}-600`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        // Ürünleri render et
        function renderUrunler() {
            const container = document.getElementById('urun-listesi');
            container.innerHTML = urunler.map((urun, index) => `
                <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 hover:shadow-lg transition-all fade-in">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 flex items-center gap-1">
                                <span>${urun.icon}</span> ${urun.ad}
                            </h3>
                            <p class="text-gray-500 text-xs mb-2">${urun.aciklama}</p>
                        </div>
                        <span class="text-blue-600 font-bold">${urun.fiyat} TL</span>
                    </div>
                    <div class="mb-2">
                        <select id="attr-${index}" class="w-full text-xs border rounded-lg p-1.5 bg-gray-50 focus:ring-2 focus:ring-blue-300 outline-none">
                            ${urun.ozellikler.map(oz => `<option value="${oz}">${oz}</option>`).join('')}
                        </select>
                    </div>
                    <button onclick="sepeteEkle(${index})" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1">
                        ➕ Sepete Ekle
                    </button>
                </div>
            `).join('');
        }

        // Sepete ekle
        function sepeteEkle(urunIndex) {
            const urun = urunler[urunIndex];
            const selectId = `attr-${urunIndex}`;
            const secilenOzellik = document.getElementById(selectId).value;
            
            let fiyat = urun.fiyat;
            const ekstra = secilenOzellik.match(/\+(\d+)/);
            if (ekstra) fiyat += parseInt(ekstra[1]);
            
            const varOlan = sepet.find(item => item.ad === urun.ad && item.ozellik === secilenOzellik);
            
            if (varOlan) {
                varOlan.adet += 1;
                showToast(`${urun.ad} (${secilenOzellik}) adedi artırıldı`, 'blue');
            } else {
                sepet.push({ ad: urun.ad, fiyat, ozellik: secilenOzellik, adet: 1 });
                showToast(`${urun.ad} sepete eklendi ✅`, 'green');
            }
            sepetiGuncelle();
        }

        // Sepetten çıkar
        function sepettenCikar(index) {
            const item = sepet[index];
            sepet.splice(index, 1);
            showToast(`${item.ad} sepetten çıkarıldı`, 'red');
            sepetiGuncelle();
        }

        // Sepeti temizle
        function sepetiTemizle() {
            if (sepet.length === 0) {
                showToast('Zaten boş 🤷', 'gray');
                return;
            }
            sepet = [];
            showToast('Sepet temizlendi 🗑️', 'red');
            sepetiGuncelle();
        }

        // Hızlı demo ekle
        function hizliDemoEkle() {
            const demoUrunler = [
                { index: 0, ozellik: 'Çift Katman (+50 TL)' },
                { index: 1, ozellik: '3mm Şeffaf' },
                { index: 2, ozellik: 'Kırmızı' },
                { index: 3, ozellik: '20cm (+15 TL)' }
            ];
            
            demoUrunler.forEach(({index, ozellik}) => {
                const urun = urunler[index];
                let fiyat = urun.fiyat;
                const ekstra = ozellik.match(/\+(\d+)/);
                if (ekstra) fiyat += parseInt(ekstra[1]);
                
                const varOlan = sepet.find(item => item.ad === urun.ad && item.ozellik === ozellik);
                if (varOlan) {
                    varOlan.adet += 1;
                } else {
                    sepet.push({ ad: urun.ad, fiyat, ozellik, adet: 1 });
                }
            });
            
            showToast('⚡ Demo ürünler eklendi!', 'purple');
            sepetiGuncelle();
        }

        // Sepeti güncelle
        function sepetiGuncelle() {
            const listeRef = document.getElementById('sepet-listesi');
            const toplamRef = document.getElementById('sepet-toplam');
            const uyariRef = document.getElementById('sepet-bos-uyari');
            
            listeRef.innerHTML = '';
            let toplamFiyat = 0;

            if (sepet.length === 0) {
                uyariRef.style.display = 'block';
                toplamRef.innerText = '0 TL';
                return;
            }
            uyariRef.style.display = 'none';

            sepet.forEach((item, index) => {
                const itemTotal = item.fiyat * item.adet;
                toplamFiyat += itemTotal;
                listeRef.innerHTML += `
                    <li class="flex justify-between items-start border-b pb-2 fade-in">
                        <div class="flex-1">
                            <span class="font-semibold text-gray-800 text-sm">${item.ad}</span>
                            <div class="text-xs text-gray-500">${item.ozellik}</div>
                            <div class="text-xs text-blue-600 mt-0.5">Adet: ${item.adet}</div>
                        </div>
                        <div class="text-right ml-2">
                            <span class="font-medium text-sm">${itemTotal} TL</span>
                            <button onclick="sepettenCikar(${index})" 
                                    class="block text-xs text-red-400 hover:text-red-600 mt-0.5 transition">
                                ✕
                            </button>
                        </div>
                    </li>
                `;
            });

            toplamRef.innerText = toplamFiyat + ' TL';
        }

        // PDF indir
        function pdfIndir() {
            if (sepet.length === 0) {
                showToast('Sepet boş! Önce ürün ekleyin 😊', 'red');
                return;
            }
            
            const element = document.getElementById('fatura-alani');
            const silButonlari = element.querySelectorAll('button');
            silButonlari.forEach(b => b.style.display = 'none');

            const opt = {
                margin: 10,
                filename: 'vital-shop-siparis.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save()
                .then(() => {
                    silButonlari.forEach(b => b.style.display = 'block');
                    showToast('PDF başarıyla indirildi 📄', 'green');
                })
                .catch(() => {
                    silButonlari.forEach(b => b.style.display = 'block');
                    showToast('PDF oluşturulamadı ❌', 'red');
                });
        }

        // Event listener'lar
        document.addEventListener('DOMContentLoaded', () => {
            renderUrunler();
            sepetiGuncelle();
            
            document.getElementById('temizle-btn').addEventListener('click', sepetiTemizle);
            document.getElementById('pdf-btn').addEventListener('click', pdfIndir);
            document.getElementById('hizli-ekle-btn').addEventListener('click', hizliDemoEkle);
        });
    </script>
</body>
</html>
