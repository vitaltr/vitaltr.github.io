<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VITAL SHOP PRO - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #fafbfc; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .fade-in-up { animation: fadeInUp 0.5s ease forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }

        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: white; padding: 14px 28px; border-radius: 16px; z-index: 1000;
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 90%; text-align: center;
            font-size: 14px; font-weight: 500; border: 1px solid rgba(255,255,255,0.08);
        }

        .product-card {
            background: white; border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer; position: relative; touch-action: manipulation;
        }
        .product-card:active { transform: scale(0.97); }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.08); border-color: rgba(37, 99, 235, 0.15); }
        .product-card .image-wrapper { position: relative; overflow: hidden; background: linear-gradient(135deg, #f8fafc, #f1f5f9); padding: 16px; }
        .product-card .image-wrapper img { width: 100%; height: 160px; object-fit: contain; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .product-card:hover .image-wrapper img { transform: scale(1.08); }
        .product-card .badge {
            position: absolute; top: 12px; left: 12px; padding: 4px 14px; border-radius: 50px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .product-card .badge.yeni { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .product-card .badge.indirim { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .product-card .badge.premium { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
        .product-card .badge.cok-satan { background: linear-gradient(135deg, #ec4899, #db2777); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }

        .product-card .fiyat {
            font-weight: 800; font-size: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .cart-badge {
            position: absolute; top: -4px; right: -4px;
            background: linear-gradient(135deg, #ef4444, #dc2626); color: white;
            border-radius: 50%; min-width: 22px; height: 22px; font-size: 10px;
            display: flex; align-items: center; justify-content: center; font-weight: 700;
            border: 2px solid white; padding: 0 4px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .modal-overlay { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .product-detail-modal { max-height: 92vh; background: white; border-radius: 32px 32px 0 0; overflow-y: auto; }
        .product-image-large {
            width: 100%; height: 340px; display: flex; align-items: center; justify-content: center;
            border-radius: 32px 32px 0 0; position: relative; overflow: hidden;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
        }
        .product-image-large img { width: 100%; height: 100%; object-fit: contain; padding: 24px; }
        .product-image-large .price-overlay {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); color: white;
            padding: 10px 24px; border-radius: 50px; font-size: 22px; font-weight: 800;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .product-image-large .badge-overlay {
            position: absolute; top: 20px; left: 20px; padding: 6px 18px; border-radius: 50px;
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }
        .product-image-large .badge-overlay.yeni { background: linear-gradient(135deg, #10b981, #059669); }
        .product-image-large .badge-overlay.indirim { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .product-image-large .badge-overlay.premium { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .product-image-large .badge-overlay.cok-satan { background: linear-gradient(135deg, #ec4899, #db2777); }

        .quantity-btn {
            width: 48px; height: 48px; border-radius: 50%; border: 2px solid #e5e7eb;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            font-weight: 600; cursor: pointer; transition: all 0.2s; touch-action: manipulation;
            background: white; color: #1a202c;
        }
        .quantity-btn:active { transform: scale(0.92); }
        .quantity-btn.minus:hover { background: #fef2f2; border-color: #fca5a5; }
        .quantity-btn.plus:hover { background: #eff6ff; border-color: #93c5fd; }

        .kategori-btn {
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 10px 24px; border-radius: 50px; font-size: 13px; font-weight: 600;
            white-space: nowrap; border: 2px solid transparent; touch-action: manipulation;
        }
        .kategori-btn:active { transform: scale(0.95); }
        .kategori-btn.aktif {
            background: linear-gradient(135deg, #2563eb, #7c3aed); color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3); border-color: transparent;
        }
        .kategori-btn.pasif { background: transparent; color: #475569; border-color: #e5e7eb; }
        .kategori-btn.pasif:hover { background: #f1f5f9; border-color: #cbd5e1; }

        .product-detail-modal::-webkit-scrollbar { width: 4px; }
        .product-detail-modal::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .sepet-item { transition: all 0.2s; }
        .sepet-item:active { transform: scale(0.98); }

        .gradient-text {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .header-gradient { background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid rgba(255,255,255,0.05); }

        .handle { width: 40px; height: 4px; background: #d1d5db; border-radius: 4px; margin: 0 auto; }

        .loading-spinner {
            width: 40px; height: 40px; border: 4px solid #e5e7eb;
            border-top-color: #2563eb; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .product-image-large { height: 240px; }
            .product-image-large .price-overlay { font-size: 17px; padding: 6px 16px; }
            .quantity-btn { width: 40px; height: 40px; font-size: 17px; }
            .product-card .image-wrapper img { height: 120px; }
            .kategori-btn { padding: 8px 16px; font-size: 12px; }
        }
        @media (max-width: 400px) {
            .product-grid { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
            .product-card .image-wrapper img { height: 100px; }
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header-gradient text-white p-4 shadow-2xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="sepeteGit()">
                <div class="w-11 h-11 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">VITAL<span class="text-blue-400">SHOP</span></h1>
                    <p class="text-[10px] opacity-60 tracking-wider uppercase">Premium Electronics</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-white/10 backdrop-blur-sm px-4 py-2 rounded-full border border-white/5">
                    <span class="text-sm font-bold" id="header-total">0 TL</span>
                </div>
                <div class="relative cursor-pointer" onclick="sepeteGit()">
                    <div class="w-11 h-11 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/10 hover:bg-white/20 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </div>
                    <span id="cart-count" class="cart-badge hidden">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="max-w-6xl mx-auto p-4">
        <div class="flex gap-2 overflow-x-auto pb-4 mb-4 scrollbar-hide snap-x">
            <button onclick="filtrele('tum', event)" class="kategori-btn aktif">🏠 Tümü</button>
            <button onclick="filtrele('elektronik', event)" class="kategori-btn pasif">💻 Elektronik</button>
            <button onclick="filtrele('kablo', event)" class="kategori-btn pasif">🔌 Kablo</button>
            <button onclick="filtrele('motor', event)" class="kategori-btn pasif">⚙️ Motor</button>
            <button onclick="filtrele('sensor', event)" class="kategori-btn pasif">📡 Sensör</button>
            <button onclick="filtrele('aksesuar', event)" class="kategori-btn pasif">🎒 Aksesuar</button>
            <button onclick="filtrele('etiket', event)" class="kategori-btn pasif">🏷️ Etiket</button>
        </div>

        <div id="urun-listesi" class="product-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4">
            <div class="col-span-full text-center py-16">
                <div class="loading-spinner"></div>
                <p class="text-gray-500 font-semibold">Ürünler yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- ===== BOTTOM SEPET ===== -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-200/50 shadow-2xl z-50 p-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="flex-1 min-w-0 cursor-pointer" onclick="sepeteGit()">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center border border-blue-100">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </div>
                    <div class="truncate">
                        <span class="font-semibold text-sm text-gray-800" id="sepet-ozet">Sepet boş</span>
                        <span class="text-xs text-gray-500 block" id="sepet-adet">0 ürün</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="font-extrabold text-xl gradient-text" id="sepet-toplam-mobil">0 TL</span>
                <button onclick="sepeteGit()" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white px-6 py-3 rounded-2xl font-bold text-sm transition shadow-lg flex items-center gap-2 active:scale-95 border border-white/10">
                    <span>Sepet</span>
                    <span id="cart-count-mobil" class="bg-white text-blue-600 rounded-full w-6 h-6 text-xs flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast hidden"></div>

    <!-- ===== ÜRÜN DETAY MODAL ===== -->
    <div id="product-modal" class="fixed inset-0 z-[100] hidden">
        <div class="modal-overlay absolute inset-0" onclick="kapatDetay()"></div>
        <div class="absolute bottom-0 left-0 right-0 product-detail-modal slide-up">
            <div class="sticky top-0 bg-white pt-4 pb-2 flex justify-center z-10">
                <div class="handle"></div>
            </div>

            <div id="modal-image" class="product-image-large">
                <img id="modal-img" src="" alt="Ürün">
                <span id="modal-price-overlay" class="price-overlay">0 TL</span>
                <span id="modal-badge" class="badge-overlay">⭐ Standart</span>
            </div>

            <div class="p-5">
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <h2 id="modal-title" class="text-2xl font-extrabold text-gray-900">Ürün Adı</h2>
                        <p id="modal-desc" class="text-sm text-gray-500 mt-1.5 leading-relaxed">Açıklama</p>
                    </div>
                </div>

                <div class="mt-5 flex items-center gap-5">
                    <span class="text-sm font-semibold text-gray-700">Adet</span>
                    <div class="flex items-center gap-4">
                        <button onclick="modalAdetDegistir(-1)" class="quantity-btn minus">−</button>
                        <span id="modal-quantity" class="text-2xl font-extrabold min-w-[40px] text-center text-gray-900">1</span>
                        <button onclick="modalAdetDegistir(1)" class="quantity-btn plus">+</button>
                    </div>
                </div>

                <div class="mt-6 flex gap-3">
                    <button onclick="modalSepeteEkle()" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white py-4 rounded-2xl font-bold text-sm transition active:scale-95 flex items-center justify-center gap-2 shadow-xl border border-white/10">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                        </svg>
                        Sepete Ekle
                    </button>
                    <button onclick="kapatDetay()" class="px-5 py-4 bg-gray-100 hover:bg-gray-200 rounded-2xl transition text-sm font-medium active:scale-95">
                        ✕
                    </button>
                </div>
            </div>
            <div class="h-4"></div>
        </div>
    </div>

    <!-- ===== SEPET MODAL ===== -->
    <div id="sepet-modal" class="fixed inset-0 z-[100] hidden">
        <div class="modal-overlay absolute inset-0" onclick="kapatSepet()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] max-h-[85vh] flex flex-col slide-up">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white rounded-t-[32px]">
                <h2 class="text-2xl font-extrabold flex items-center gap-2 text-gray-900">
                    🛍️ Sepetim
                    <span class="text-sm font-normal text-gray-500" id="modal-sepet-adet">(0)</span>
                </h2>
                <div class="flex gap-2">
                    <button onclick="sepetiTemizle()" class="text-red-500 text-sm font-semibold px-4 py-2 rounded-full bg-red-50 hover:bg-red-100 transition active:scale-95">
                        🗑️ Temizle
                    </button>
                    <button onclick="kapatSepet()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none transition">✕</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4" id="modal-sepet-listesi">
                <div class="text-center text-gray-400 py-16">
                    <div class="text-6xl mb-4">🛒</div>
                    <p class="text-lg font-semibold text-gray-600">Sepetiniz boş</p>
                    <p class="text-sm mt-1">Ürün eklemek için ürünlere tıkla</p>
                </div>
            </div>

            <div class="p-5 border-t border-gray-100 bg-gray-50/50 rounded-b-[32px]">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-semibold text-gray-700 text-lg">Toplam</span>
                    <span class="font-extrabold text-3xl gradient-text" id="modal-sepet-toplam">0 TL</span>
                </div>
                <button onclick="pdfIndir()" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white py-4 rounded-2xl font-bold text-sm transition active:scale-95 flex items-center justify-center gap-2 shadow-xl border border-white/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    PDF İndir
                </button>
            </div>
        </div>
    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ============================================================
        // 👇👇👇 BURAYA KENDİ firebaseConfig KODUNU YAPIŞTIR 👇👇👇
        // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCTHNBtLFn6UItQ9a0QkcSV1ybDVD4x5QU",
    authDomain: "vitalweb-c3290.firebaseapp.com",
    projectId: "vitalweb-c3290",
    storageBucket: "vitalweb-c3290.firebasestorage.app",
    messagingSenderId: "204342714119",
    appId: "1:204342714119:web:7d61d6f853eef3d790efa2",
    measurementId: "G-C2ZL944MPR"
  };
        // ============================================================
        // 👆👆👆 BURAYA KADAR 👆👆👆
        // ============================================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global değişkenler (module dışından erişilebilsin diye window'a bağlıyoruz)
        window.urunler = [];
        window.sepet = [];
        window.aktifKategori = 'tum';
        window.modalData = { urunIndex: 0, adet: 1 };

        // Etiketten CSS sınıfı üret
        function badgeClassFromTag(tag) {
            if (!tag) return '';
            if (tag.includes('Yeni')) return 'yeni';
            if (tag.includes('İndirim') || tag.includes('Fırsat')) return 'indirim';
            if (tag.includes('Premium')) return 'premium';
            if (tag.includes('Çok Satan') || tag.includes('En Çok')) return 'cok-satan';
            return '';
        }

        // Firebase'den ürünleri canlı çek
        const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snapshot) => {
            window.urunler = snapshot.docs.map((docSnap) => {
                const p = docSnap.data();
                return {
                    id: docSnap.id,
                    ad: p.name || 'İsimsiz Ürün',
                    fiyat: Number(p.price) || 0,
                    aciklama: p.description || '',
                    img: p.image || 'https://via.placeholder.com/400x400/f1f5f9/94a3b8?text=Resim+Yok',
                    kategori: p.category || 'diger',
                    badge: p.tag || '',
                    badgeClass: badgeClassFromTag(p.tag)
                };
            });

            window.renderUrunler();
            window.sepetiGuncelle();
        }, (error) => {
            console.error('Firestore hatası:', error);
            const container = document.getElementById('urun-listesi');
            if (container) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="text-5xl mb-4">⚠️</div>
                        <p class="text-lg font-semibold text-red-600">Ürünler yüklenemedi</p>
                        <p class="text-sm text-gray-500 mt-2">${error.message}</p>
                    </div>
                `;
            }
        });

        // ===== TOAST =====
        window.showToast = function(mesaj, renk = 'blue') {
            const toast = document.getElementById('toast');
            toast.textContent = mesaj;
            const renkMap = {
                blue: 'bg-blue-600', green: 'bg-green-600', red: 'bg-red-600',
                purple: 'bg-purple-600', orange: 'bg-orange-600', gray: 'bg-gray-600'
            };
            toast.className = `toast ${renkMap[renk] || 'bg-blue-600'} hidden`;
            setTimeout(() => toast.classList.remove('hidden'), 50);
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.add('hidden'), 2200);
        };

        // ===== FİLTRE =====
        window.filtrele = function(kategori, e) {
            window.aktifKategori = kategori;
            document.querySelectorAll('.kategori-btn').forEach(btn => {
                btn.className = 'kategori-btn pasif';
            });
            if (e) e.target.className = 'kategori-btn aktif';
            window.renderUrunler();
        };

        // ===== ÜRÜN LİSTESİ =====
        window.renderUrunler = function() {
            const container = document.getElementById('urun-listesi');
            const urunler = window.urunler;

            if (!urunler || urunler.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="text-6xl mb-4">📦</div>
                        <p class="text-lg font-semibold text-gray-600">Henüz ürün eklenmemiş</p>
                        <p class="text-sm text-gray-400 mt-2">Admin panelinden ürün ekleyin</p>
                    </div>
                `;
                return;
            }

            const filtrelenmis = window.aktifKategori === 'tum'
                ? urunler
                : urunler.filter(u => u.kategori === window.aktifKategori);

            if (filtrelenmis.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-400">
                        <div class="text-5xl mb-4">🔍</div>
                        <p class="text-lg font-semibold text-gray-600">Bu kategoride ürün yok</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtrelenmis.map((urun, index) => {
                const realIndex = urunler.indexOf(urun);
                const sepetteki = window.sepet.find(s => s.id === urun.id);
                const adet = sepetteki ? sepetteki.adet : 0;
                const badgeClass = urun.badgeClass ? `badge ${urun.badgeClass}` : 'badge';
                return `
                    <div class="product-card fade-in-up" onclick="detayAc(${realIndex})" style="animation-delay: ${index * 0.05}s">
                        <div class="image-wrapper">
                            <img src="${urun.img}" alt="${urun.ad}" loading="lazy">
                            ${urun.badge ? `<span class="${badgeClass}">${urun.badge}</span>` : ''}
                            ${adet > 0 ? `<div class="absolute bottom-3 right-3 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">${adet} adet</div>` : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-semibold text-sm text-gray-800 leading-tight">${urun.ad}</h3>
                            <p class="text-xs text-gray-400 mt-0.5 truncate">${urun.aciklama}</p>
                            <div class="flex items-center justify-between mt-2">
                                <span class="fiyat">${urun.fiyat} TL</span>
                                <span class="text-[10px] text-gray-400">${urun.kategori}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // ===== DETAY AÇ =====
        window.detayAc = function(index) {
            const urun = window.urunler[index];
            if (!urun) return;

            window.modalData.urunIndex = index;
            window.modalData.adet = 1;

            document.getElementById('modal-title').textContent = urun.ad;
            document.getElementById('modal-desc').textContent = urun.aciklama || 'Açıklama yok';
            document.getElementById('modal-img').src = urun.img;

            const badgeEl = document.getElementById('modal-badge');
            if (urun.badge) {
                badgeEl.textContent = urun.badge;
                badgeEl.className = `badge-overlay ${urun.badgeClass || ''}`;
                badgeEl.style.display = '';
            } else {
                badgeEl.style.display = 'none';
            }

            document.getElementById('modal-price-overlay').textContent = urun.fiyat + ' TL';
            document.getElementById('modal-quantity').textContent = '1';
            document.getElementById('product-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            if (navigator.vibrate) navigator.vibrate(10);
        };

        // ===== MODAL ADET =====
        window.modalAdetDegistir = function(delta) {
            window.modalData.adet = Math.max(1, window.modalData.adet + delta);
            document.getElementById('modal-quantity').textContent = window.modalData.adet;

            const urun = window.urunler[window.modalData.urunIndex];
            if (!urun) return;
            const toplamFiyat = urun.fiyat * window.modalData.adet;
            document.getElementById('modal-price-overlay').textContent = toplamFiyat + ' TL';
        };

        // ===== MODAL SEPETE EKLE =====
        window.modalSepeteEkle = function() {
            const urun = window.urunler[window.modalData.urunIndex];
            if (!urun) return;

            const varOlan = window.sepet.find(item => item.id === urun.id);
            if (varOlan) {
                varOlan.adet += window.modalData.adet;
            } else {
                window.sepet.push({
                    id: urun.id,
                    ad: urun.ad,
                    fiyat: urun.fiyat,
                    ozellik: urun.kategori,
                    adet: window.modalData.adet,
                    img: urun.img,
                    badge: urun.badge
                });
            }

            window.showToast(`✅ ${urun.ad} sepete eklendi`, 'green');
            window.kapatDetay();
            window.sepetiGuncelle();
            if (navigator.vibrate) navigator.vibrate(15);
        };

        // ===== SEPET İŞLEMLERİ =====
        window.sepettenCikar = function(index) {
            const item = window.sepet[index];
            if (item.adet > 1) {
                item.adet -= 1;
                window.showToast(`➖ ${item.ad} adet azaltıldı`, 'orange');
            } else {
                window.sepet.splice(index, 1);
                window.showToast(`❌ ${item.ad} çıkarıldı`, 'red');
            }
            window.sepetiGuncelle();
        };

        window.sepetiTemizle = function() {
            if (window.sepet.length === 0) { window.showToast('🤷 Zaten boş', 'gray'); return; }
            window.sepet = [];
            window.showToast('🗑️ Sepet temizlendi', 'red');
            window.sepetiGuncelle();
        };

        window.sepeteHizliEkle = function(index) {
            const item = window.sepet[index];
            const varOlan = window.sepet.find(s => s.id === item.id && s.ozellik === item.ozellik);
            if (varOlan) varOlan.adet += 1;
            window.sepetiGuncelle();
            if (navigator.vibrate) navigator.vibrate(10);
        };

        // ===== SEPET GÜNCELLE =====
        window.sepetiGuncelle = function() {
            const sepet = window.sepet;
            const toplamFiyat = sepet.reduce((sum, item) => sum + (item.fiyat * item.adet), 0);
            const toplamAdet = sepet.reduce((sum, item) => sum + item.adet, 0);

            document.getElementById('header-total').textContent = toplamFiyat + ' TL';
            document.getElementById('sepet-ozet').textContent = sepet.length > 0 ? `${sepet.length} ürün` : 'Sepet boş';
            document.getElementById('sepet-adet').textContent = `${toplamAdet} ürün`;
            document.getElementById('sepet-toplam-mobil').textContent = toplamFiyat + ' TL';

            const badge = document.getElementById('cart-count');
            const badgeMobil = document.getElementById('cart-count-mobil');
            const goster = toplamAdet > 0 ? (toplamAdet > 9 ? '9+' : toplamAdet) : '0';
            if (toplamAdet > 0) {
                badge.classList.remove('hidden');
                badge.textContent = goster;
                badgeMobil.textContent = goster;
            } else {
                badge.classList.add('hidden');
                badgeMobil.textContent = '0';
            }

            const modalListe = document.getElementById('modal-sepet-listesi');
            const modalToplam = document.getElementById('modal-sepet-toplam');
            const modalAdet = document.getElementById('modal-sepet-adet');

            modalAdet.textContent = `(${toplamAdet})`;

            if (sepet.length === 0) {
                modalListe.innerHTML = `
                    <div class="text-center text-gray-400 py-16">
                        <div class="text-6xl mb-4">🛒</div>
                        <p class="text-lg font-semibold text-gray-600">Sepetiniz boş</p>
                        <p class="text-sm mt-1">Ürün eklemek için ürünlere tıkla</p>
                    </div>
                `;
            } else {
                modalListe.innerHTML = sepet.map((item, index) => `
                    <div class="sepet-item flex items-center justify-between py-3 border-b border-gray-100">
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <img src="${item.img}" class="w-12 h-12 object-contain rounded-xl bg-gray-50 p-1.5 border border-gray-100">
                            <div class="truncate">
                                <div class="font-semibold text-sm truncate">${item.ad}</div>
                                <div class="text-xs text-gray-400 truncate">${item.ozellik}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 ml-2">
                            <button onclick="sepettenCikar(${index})" class="w-8 h-8 rounded-full bg-red-50 text-red-500 font-bold flex items-center justify-center active:scale-90 transition hover:bg-red-100">−</button>
                            <span class="font-bold text-sm min-w-[24px] text-center">${item.adet}</span>
                            <button onclick="sepeteHizliEkle(${index})" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold flex items-center justify-center active:scale-90 transition hover:bg-blue-100">+</button>
                            <span class="font-bold text-sm min-w-[55px] text-right gradient-text">${item.fiyat * item.adet} TL</span>
                        </div>
                    </div>
                `).join('');
            }

            modalToplam.textContent = toplamFiyat + ' TL';
            window.renderUrunler();
        };

        // ===== MODAL KAPAT =====
        window.kapatDetay = function() {
            document.getElementById('product-modal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        window.kapatSepet = function() {
            document.getElementById('sepet-modal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        window.sepeteGit = function() {
            const modal = document.getElementById('sepet-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                window.sepetiGuncelle();
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        };

        // ===== PDF =====
        window.pdfIndir = function() {
            const sepet = window.sepet;
            if (sepet.length === 0) {
                window.showToast('😊 Sepet boş!', 'red');
                return;
            }

            window.showToast('⏳ PDF hazırlanıyor...', 'blue');

            const content = document.createElement('div');
            content.style.padding = '30px';
            content.style.fontFamily = 'Inter, Arial, sans-serif';
            content.style.background = '#ffffff';
            content.innerHTML = `
                <div style="text-align:center; margin-bottom:30px; border-bottom:2px solid #e5e7eb; padding-bottom:20px;">
                    <h1 style="color: #1e293b; font-size: 28px; font-weight:800; margin-bottom:4px;">VITAL<span style="color:#2563eb;">SHOP</span></h1>
                    <p style="color: #64748b; font-size:13px;">Sipariş Özeti • ${new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' })}</p>
                </div>
                ${sepet.map(item => `
                    <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f1f5f9;">
                        <div>
                            <div style="font-weight:600; font-size:15px; color:#1e293b;">${item.ad}</div>
                            <div style="font-size:12px; color:#94a3b8;">${item.ozellik} × ${item.adet}</div>
                        </div>
                        <span style="font-weight:700; font-size:16px; color:#2563eb;">${item.fiyat * item.adet} TL</span>
                    </div>
                `).join('')}
                <div style="display:flex; justify-content:space-between; padding:16px 0; margin-top:12px; border-top:2px solid #1e293b;">
                    <span style="font-size:18px; font-weight:700; color:#1e293b;">TOPLAM</span>
                    <span style="font-size:22px; font-weight:800; color:#2563eb;">${sepet.reduce((sum, item) => sum + (item.fiyat * item.adet), 0)} TL</span>
                </div>
                <div style="margin-top:30px; color:#94a3b8; font-size:11px; text-align:center; border-top:1px solid #e5e7eb; padding-top:20px;">
                    Teşekkür ederiz! 🙏
                </div>
            `;

            html2pdf().set({
                margin: 15,
                filename: 'vital-shop-siparis.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(content).save()
                .then(() => window.showToast('📄 PDF indirildi', 'green'))
                .catch(() => window.showToast('❌ PDF hatası', 'red'));
        };

        // Klavye kısayolları
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { window.kapatDetay(); window.kapatSepet(); }
        });
    </script>
</body>
</html>
