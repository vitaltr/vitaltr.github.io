<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SHOP</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#111;color:#fff}
.menu button{margin:3px;padding:6px 10px;background:#333;color:#fff;border:none;border-radius:5px;cursor:pointer}
.product{display:flex;gap:15px;background:#fff;margin:10px;padding:10px;border-radius:10px}
.product img{width:130px;border-radius:8px}
.right{flex:1}
.cart{background:#00d4ff;padding:5px 10px;border-radius:5px}
.order{position:fixed;bottom:20px;right:20px;background:green;color:#fff;padding:15px;border:none;border-radius:30px;cursor:pointer}
input,select{width:100%;margin-top:5px;padding:6px}
</style>
</head>

<body>

<header>
<div>SHOP</div>
<div class="menu" id="menu"></div>
<div class="cart">🛒 <span id="cartCount">0</span></div>
</header>

<main id="app"></main>

<button class="order" onclick="sendOrder()">Sipariş</button>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];
let cart=[];
let active=0;

function renderMenu(){
let m=document.getElementById("menu");
m.innerHTML="";
data.forEach((c,i)=>{
m.innerHTML+=`<button onclick="openPage(${i})">${c.title}</button>`;
});
}

function openPage(i){
active=i;
render();
}

function render(){
let app=document.getElementById("app");
app.innerHTML="";

if(!data.length) return;

data[active].products.forEach(p=>{
app.innerHTML+=`
<div class="product">
<img src="${p.img}">
<div class="right">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<b>${p.price} TL</b>

${p.personalize ? `<input id="c${p.id}" placeholder="Kişiselleştirme">` : ""}

${p.options?.length ? `
<select id="o${p.id}">
${p.options.map(o=>`<option value="${o.price}">${o.name}</option>`).join("")}
</select>` : ""}

<button onclick="addCart(${p.id})">Sepete</button>
</div>
</div>
`;
});

document.getElementById("cartCount").innerText=cart.length;
}

function addCart(id){
let product;

data.forEach(c=>{
c.products.forEach(p=>{
if(p.id==id) product=p;
});
});

let extra=0,opt="",custom="";

if(product.options?.length){
let s=document.getElementById("o"+id);
extra=parseInt(s.value);
opt=s.options[s.selectedIndex].text;
}

if(product.personalize){
custom=document.getElementById("c"+id).value;
}

cart.push({
name:product.name,
price:product.price+extra,
opt,custom
});

document.getElementById("cartCount").innerText=cart.length;
}

function sendOrder(){
let msg="Sipariş:%0A";
cart.forEach(c=>{
msg+=`- ${c.name} ${c.price}TL ${c.opt||""} ${c.custom||""}%0A`;
});
window.open("https://wa.me/90XXXXXXXXXX?text="+msg);
}

renderMenu();
render();
</script>

</body>
</html>
