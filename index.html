<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SHOP</title>

<style>
body{margin:0;font-family:Arial;background:#f3f5f7}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
background:#111;
color:white;
position:sticky;
top:0;
}

.logo{font-weight:bold}
.logo span{color:#00d4ff}

.nav{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.nav button{
background:#222;
color:#fff;
border:none;
padding:6px 10px;
border-radius:20px;
cursor:pointer;
}

.nav button.active{
background:#00d4ff;
color:#000;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.body{padding:10px}

.price{color:green;font-weight:bold}

button.add{
width:100%;
padding:10px;
border:none;
background:linear-gradient(90deg,#00d4ff,#00ffa3);
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="logo">VITAL<span>SHOP</span></div>
<div class="nav" id="nav"></div>
</header>

<div class="container" id="products"></div>

<script>
let store = JSON.parse(localStorage.getItem("store")) || {categories:[]};
let active=0;
let cart=[];

/* NAV */
function renderNav(){
let nav=document.getElementById("nav");
nav.innerHTML="";

store.categories.forEach((c,i)=>{
nav.innerHTML+=`
<button class="${i===active?'active':''}" onclick="openCat(${i})">
${c.name}
</button>`;
});
}

function openCat(i){
active=i;
render();
renderNav();
}

/* PRODUCTS */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

if(!store.categories.length) return;

let cat = store.categories[active];

cat.products.forEach(p=>{
let img = p.img.includes("http") ? p.img : "images/"+p.img;

box.innerHTML+=`
<div class="card">
<img src="${img}">
<div class="body">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">${p.price} TL</div>
<button class="add" onclick="addCart(${p.id})">Sepete Ekle</button>
</div>
</div>
`;
});
}

function addCart(id){
store.categories.forEach(c=>{
c.products.forEach(p=>{
if(p.id===id){
cart.push(p);
}
});
});
alert("Sepete eklendi: "+cart.length);
}

renderNav();
render();
</script>

</body>
</html>
