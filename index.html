<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>VITAL SHOP</title>

<style>
body{
margin:0;
font-family:Inter, Arial;
background:#f2f4f7;
color:#111;
}

/* TOP BAR */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
background:rgba(20,20,20,0.95);
backdrop-filter: blur(10px);
color:white;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:18px;
font-weight:700;
letter-spacing:1px;
}

.logo span{
color:#00d4ff;
}

/* CATEGORY BAR */
.nav{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.nav button{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
color:white;
padding:7px 12px;
border-radius:999px;
cursor:pointer;
transition:0.2s;
font-size:13px;
}

.nav button:hover{
background:#00d4ff;
color:black;
transform:translateY(-1px);
}

.nav button.active{
background:#00d4ff;
color:#000;
font-weight:bold;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
padding:20px;
}

/* CARD */
.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
transition:0.25s;
border:1px solid #eee;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

.card img{
width:100%;
height:190px;
object-fit:cover;
}

.card-body{
padding:12px;
}

.title{
font-size:16px;
font-weight:700;
margin:5px 0;
}

.desc{
font-size:13px;
color:#666;
min-height:35px;
}

.price{
margin-top:10px;
font-weight:800;
color:#00b894;
}

/* BUTTON */
.btn{
width:100%;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
background:linear-gradient(135deg,#00d4ff,#00ffa3);
transition:0.2s;
margin-top:10px;
}

.btn:hover{
opacity:0.85;
transform:scale(1.02);
}
</style>
</head>

<body>

<header>
<div class="logo">VITAL<span>SHOP</span></div>
<div class="nav" id="nav"></div>
</header>

<div class="container" id="products"></div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];
let active = 0;

/* NAV */
function renderNav(){
let nav=document.getElementById("nav");
nav.innerHTML="";

data.forEach((c,i)=>{
nav.innerHTML+=`
<button class="${i===active?'active':''}" onclick="openCat(${i})">
${c.title}
</button>`;
});
}

function openCat(i){
active=i;
render();
renderNav();
}

/* PRODUCTS */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

if(!data.length) return;

data[active].products.forEach(p=>{

let img = p.img.includes("http")
? p.img
: "images/" + p.img;

box.innerHTML+=`
<div class="card">
<img src="${img}">
<div class="card-body">
<div class="title">${p.name}</div>
<div class="desc">${p.desc || ""}</div>
<div class="price">${p.price} TL</div>
<button class="btn">Sepete Ekle</button>
</div>
</div>
`;
});
}

renderNav();
render();
</script>

</body>
</html>
