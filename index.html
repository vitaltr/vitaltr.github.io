<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOP</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f3f5f7;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#111;
color:white;
flex-wrap:wrap;
}

.logo span{color:#00d4ff}

.nav{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.nav button{
background:#222;
color:white;
border:none;
padding:6px 10px;
border-radius:20px;
cursor:pointer;
}

.nav button.active{
background:#00d4ff;
color:black;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:12px;
padding:12px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.body{
padding:10px;
}

.price{
color:green;
font-weight:bold;
}

button{
border:none;
padding:6px;
border-radius:6px;
cursor:pointer;
}

.cartbtn{background:#00d4ff}
.favbtn{background:#ff4d6d;color:white}

/* MOBILE */
@media(max-width:768px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="logo">VITAL<span>SHOP</span></div>
<div class="nav" id="nav"></div>
<button onclick="location.href='cart.html'">🛒</button>
</header>

<div class="container" id="products"></div>

<script>
/*
📦 store = tüm veri
localStorage içinde tutulur
*/
let store = JSON.parse(localStorage.getItem("store")) || {
categories:[
{
name:"Genel",
products:[
{
id:1,
name:"Mouse",
price:200,
img:"1.jpg",
desc:"Gaming mouse",
stock:5
}
]
}
]
};

let active=0;
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let fav = JSON.parse(localStorage.getItem("fav")) || [];

/* KATEGORİLER */
function renderNav(){
let nav=document.getElementById("nav");
nav.innerHTML="";

store.categories.forEach((c,i)=>{
nav.innerHTML+=`
<button class="${i===active?'active':''}" onclick="openCat(${i})">
${c.name}
</button>`;
});
}

function openCat(i){
active=i;
render();
renderNav();
}

/* ÜRÜNLER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

let cat = store.categories[active];

cat.products.forEach(p=>{

let img = p.img.startsWith("http") ? p.img : "images/"+p.img;

box.innerHTML+=`
<div class="card">
<img src="${img}">
<div class="body">
<h3>${p.name}</h3>
<p>${p.desc}</p>

<div>Stok: ${p.stock}</div>
<div class="price">${p.price} TL</div>

<button class="cartbtn" onclick="addCart(${p.id})">Sepet</button>
<button class="favbtn" onclick="favToggle(${p.id})">❤️</button>
</div>
</div>
`;
});
}

/* SEPET */
function addCart(id){
store.categories.forEach(c=>{
c.products.forEach(p=>{
if(p.id===id){
if(p.stock<=0){
alert("Stok yok");
return;
}
cart.push(p);
localStorage.setItem("cart",JSON.stringify(cart));
}
});
});
}

/* FAVORİ */
function favToggle(id){
let f = fav.find(x=>x.id===id);

if(f){
fav = fav.filter(x=>x.id!==id);
}else{
store.categories.forEach(c=>{
c.products.forEach(p=>{
if(p.id===id) fav.push(p);
});
});
}

localStorage.setItem("fav",JSON.stringify(fav));
}

renderNav();
render();
</script>

</body>
</html>
