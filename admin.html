<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL</title>

<style>
body{font-family:Arial;padding:20px}
input,select{display:block;margin:5px 0;padding:8px}
.box{border:1px solid #ccc;padding:10px;margin:10px 0}
button{padding:8px 12px}
</style>
</head>

<body>

<h2>ADMIN PANEL</h2>

<input type="password" id="pass" placeholder="Şifre">
<button onclick="login()">Giriş</button>

<div id="panel" style="display:none">

<h3>Kategori Ekle</h3>
<input id="title" placeholder="Kategori adı">
<button onclick="addCategory()">Ekle</button>

<h3>Ürün Ekle</h3>

<select id="cat"></select>
<input id="name" placeholder="Ürün">
<input id="price" placeholder="Fiyat">
<input id="img" placeholder="Resim URL">

<button onclick="addProduct()">Ürün Ekle</button>

<h3>Mevcut Sistem</h3>
<div id="list"></div>

</div>

<script src="admin.js"></script>
</body>
</html>
