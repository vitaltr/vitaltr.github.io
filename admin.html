<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL</title>

<style>
body{font-family:Arial;padding:20px}
input,select,textarea{display:block;margin:5px 0;padding:8px;width:260px}
button{padding:8px 12px;cursor:pointer;margin-top:5px}
.box{border:1px solid #ddd;padding:10px;margin:10px 0}
</style>
</head>

<body>

<h2>ADMIN PANEL</h2>

<input type="password" id="pass" placeholder="Şifre">
<button onclick="login()">Giriş</button>

<div id="panel" style="display:none">

<h3>Kategori Ekle</h3>
<input id="cat">
<button onclick="addCat()">Ekle</button>

<h3>Kategoriler</h3>
<div id="catList"></div>

<h3>Ürün Ekle</h3>

<select id="category"></select>

<input id="name" placeholder="Ürün adı">
<input id="price" placeholder="Fiyat">
<input id="img" placeholder="Resim URL">
<input id="desc" placeholder="Açıklama">

<label><input type="checkbox" id="personalize"> Kişiselleştirme</label>

<textarea id="options" placeholder="Standart:0&#10;Özel:50"></textarea>

<button onclick="addProduct()">Ürün Ekle</button>

<div id="list"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];

/* LOGIN */
function login(){
if(pass.value==="1234"){
panel.style.display="block";
renderAll();
}else alert("Hatalı şifre");
}

/* SAVE */
function save(){
localStorage.setItem("data",JSON.stringify(data));
renderAll();
}

/* CATEGORY ADD */
function addCat(){
if(!cat.value) return;
data.push({title:cat.value,products:[]});
cat.value="";
save();
}

/* CATEGORY DELETE */
function deleteCat(i){
data.splice(i,1);
save();
}

/* PRODUCT ADD */
function addProduct(){
let i=category.value;
if(i==="") return;

let opts = options.value.trim()
? options.value.split("\n").map(x=>{
let [n,p]=x.split(":");
return {name:n,price:parseInt(p)||0};
})
: [];

data[i].products.push({
id:Date.now(),
name:name.value,
price:parseInt(price.value)||0,
img:img.value,
desc:desc.value,
personalize:personalize.checked,
options:opts
});

save();
}

/* RENDER ALL */
function renderAll(){

/* category dropdown */
let c=document.getElementById("category");
c.innerHTML="";

data.forEach((x,i)=>{
c.innerHTML+=`<option value="${i}">${x.title}</option>`;
});

/* category list */
let catList=document.getElementById("catList");
catList.innerHTML="";

data.forEach((c,i)=>{
catList.innerHTML+=`
<div class="box">
<b>${c.title}</b>
<button onclick="deleteCat(${i})">Kategori Sil</button>
</div>
`;
});

/* product list */
let list=document.getElementById("list");
list.innerHTML="";

data.forEach((c,i)=>{
list.innerHTML+=`
<div class="box">
<h4>${c.title}</h4>

${c.products.map(p=>`
<div>
${p.name} - ${p.price} TL
</div>
`).join("")}

</div>
`;
});
}
</script>

</body>
</html>
