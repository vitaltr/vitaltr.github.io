<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL</title>

<style>
body{
font-family:Arial;
background:#f5f6f8;
padding:20px;
}

h2{color:#111}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input,select,textarea{
width:100%;
padding:10px;
margin:5px 0;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

button{
padding:10px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn-blue{background:#00bcd4;color:#fff}
.btn-red{background:#e74c3c;color:#fff}
.btn-green{background:#2ecc71;color:#fff}

.row{display:flex;gap:10px}

.small-btn{
padding:6px 10px;
font-size:12px;
background:#333;
color:#fff;
border-radius:6px;
cursor:pointer;
margin:2px;
}

.product-box{
border:1px solid #eee;
padding:10px;
border-radius:8px;
margin-top:10px;
}
</style>
</head>

<body>

<h2>ADMIN PANEL</h2>

<!-- LOGIN -->
<div class="card">
<input type="password" id="pass" placeholder="Şifre">
<button class="btn-blue" onclick="login()">Giriş</button>
</div>

<div id="panel" style="display:none">

<!-- KATEGORİ -->
<div class="card">
<h3>Kategori Ekle</h3>
<input id="cat" placeholder="Kategori adı">
<button class="btn-green" onclick="addCat()">Ekle</button>

<h4>Kategoriler</h4>
<div id="catList"></div>
</div>

<!-- ÜRÜN -->
<div class="card">
<h3>Ürün Ekle</h3>

<select id="category"></select>

<input id="name" placeholder="Ürün adı">
<input id="price" placeholder="Fiyat">
<textarea id="desc" placeholder="Açıklama"></textarea>

<!-- RESİM -->
<input id="img" placeholder="Resim URL">

<div>
<p>Hazır Resimler:</p>
<button class="small-btn" onclick="setImg('https://picsum.photos/300/200?1')">1</button>
<button class="small-btn" onclick="setImg('https://picsum.photos/300/200?2')">2</button>
<button class="small-btn" onclick="setImg('https://picsum.photos/300/200?3')">3</button>
</div>

<label>
<input type="checkbox" id="personalize"> Kişiselleştirme
</label>

<textarea id="options" placeholder="Standart:0
Özel:50"></textarea>

<button class="btn-blue" onclick="addProduct()">Ürün Ekle</button>
</div>

<!-- LİSTE -->
<div class="card">
<h3>Ürünler</h3>
<div id="list"></div>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];

/* LOGIN */
function login(){
if(pass.value==="1234"){
panel.style.display="block";
renderAll();
}else alert("Hatalı şifre");
}

/* SAVE */
function save(){
localStorage.setItem("data",JSON.stringify(data));
renderAll();
}

/* IMG QUICK */
function setImg(url){
document.getElementById("img").value = url;
}

/* ADD CATEGORY */
function addCat(){
if(!cat.value) return;
data.push({title:cat.value,products:[]});
cat.value="";
save();
}

/* DELETE CATEGORY */
function deleteCat(i){
data.splice(i,1);
save();
}

/* ADD PRODUCT */
function addProduct(){
let i = category.value;

let opts = options.value.trim()
? options.value.split("\n").map(x=>{
let [n,p]=x.split(":");
return {name:n,price:parseInt(p)||0};
})
: [];

data[i].products.push({
id:Date.now(),
name:name.value,
price:parseInt(price.value)||0,
img:img.value,
desc:desc.value,
personalize:personalize.checked,
options:opts
});

save();
}

/* DELETE PRODUCT */
function deleteProduct(ci,pi){
data[ci].products.splice(pi,1);
save();
}

/* RENDER */
function renderAll(){

/* category dropdown */
let c=document.getElementById("category");
c.innerHTML="";
data.forEach((x,i)=>{
c.innerHTML+=`<option value="${i}">${x.title}</option>`;
});

/* categories */
let catList=document.getElementById("catList");
catList.innerHTML="";

data.forEach((c,i)=>{
catList.innerHTML+=`
<div class="product-box">
<b>${c.title}</b>
<button class="btn-red" onclick="deleteCat(${i})">Sil</button>
</div>`;
});

/* products */
let list=document.getElementById("list");
list.innerHTML="";

data.forEach((c,ci)=>{
list.innerHTML+=`<h4>${c.title}</h4>`;

c.products.forEach((p,pi)=>{
list.innerHTML+=`
<div class="product-box">
<img src="${p.img}" width="100"><br>
<b>${p.name}</b> - ${p.price} TL
<br>
<button class="btn-red" onclick="deleteProduct(${ci},${pi})">Ürün Sil</button>
</div>
`;
});
});
}
</script>

</body>
</html>
