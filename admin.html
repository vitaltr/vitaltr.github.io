<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ADMIN</title>

<style>
body{font-family:Arial;padding:20px;background:#f4f6f8}
.box{background:#fff;padding:10px;margin:10px 0;border-radius:10px}
input,textarea{width:100%;padding:8px;margin:5px 0}
button{padding:6px;border:none;border-radius:6px;cursor:pointer}
.green{background:#2ecc71;color:#fff}
.red{background:#e74c3c;color:#fff}
.blue{background:#3498db;color:#fff}
</style>
</head>

<body>

<h2>ADMIN</h2>

<input type="password" id="pass">
<button class="blue" onclick="login()">Giriş</button>

<div id="panel" style="display:none">

<!-- CAT -->
<div class="box">
<h3>Kategori</h3>
<input id="cat">
<button class="green" onclick="addCat()">Ekle</button>
</div>

<!-- PRODUCT -->
<div class="box">
<h3>Ürün</h3>

<select id="catSelect"></select>

<input id="name">
<input id="price">
<input id="img">
<input id="stock">
<textarea id="desc"></textarea>

<button class="green" onclick="addProduct()">Ekle</button>
<button class="blue" onclick="updateProduct()" id="upd" style="display:none">Güncelle</button>
</div>

<!-- LIST -->
<div id="list"></div>

</div>

<script>
let store = JSON.parse(localStorage.getItem("store")) || {categories:[]};
let edit={c:-1,p:-1};

function login(){
if(pass.value==="1234"){
panel.style.display="block";
render();
}
}

/* SAVE */
function save(){
localStorage.setItem("store",JSON.stringify(store));
render();
}

/* CAT */
function addCat(){
store.categories.push({
id:Date.now(),
name:cat.value,
products:[]
});
save();
}

/* PRODUCT */
function addProduct(){
let i=catSelect.value;

store.categories[i].products.push({
id:Date.now(),
name:name.value,
price:price.value,
img:img.value,
stock:stock.value,
desc:desc.value
});

save();
}

/* EDIT */
function editProduct(ci,pi){
let p=store.categories[ci].products[pi];

name.value=p.name;
price.value=p.price;
img.value=p.img;
stock.value=p.stock;
desc.value=p.desc;

edit={c:ci,p:pi};
upd.style.display="block";
}

function updateProduct(){
let p=store.categories[edit.c].products[edit.p];

p.name=name.value;
p.price=price.value;
p.img=img.value;
p.stock=stock.value;
p.desc=desc.value;

upd.style.display="none";
save();
}

/* DELETE */
function delProduct(ci,pi){
store.categories[ci].products.splice(pi,1);
save();
}

/* RENDER */
function render(){

catSelect.innerHTML="";
store.categories.forEach((c,i)=>{
catSelect.innerHTML+=`<option value="${i}">${c.name}</option>`;
});

let list=document.getElementById("list");
list.innerHTML="";

store.categories.forEach((c,ci)=>{
list.innerHTML+=`<h3>${c.name}</h3>`;

c.products.forEach((p,pi)=>{
list.innerHTML+=`
<div class="box">
<b>${p.name}</b>
<button class="blue" onclick="editProduct(${ci},${pi})">Edit</button>
<button class="red" onclick="delProduct(${ci},${pi})">Sil</button>
</div>`;
});
});
}
</script>

</body>
</html>
