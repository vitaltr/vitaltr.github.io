<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sepet</title>

<style>
body{font-family:Arial;background:#f3f5f7;padding:10px}

.item{
background:white;
padding:10px;
margin:10px 0;
border-radius:8px;
display:flex;
justify-content:space-between;
}

.total{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

button{
background:red;
color:white;
border:none;
padding:5px;
border-radius:6px;
cursor:pointer;
}

.checkout{
background:#00d4ff;
width:100%;
padding:10px;
font-weight:bold;
}
</style>
</head>

<body>

<h2>Sepet</h2>

<div id="list"></div>
<div class="total" id="total"></div>

<button class="checkout" onclick="go()">Ödeme</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){
let box=document.getElementById("list");
box.innerHTML="";

let sum=0;

cart.forEach((p,i)=>{
sum += Number(p.price);

box.innerHTML+=`
<div class="item">
<div>${p.name}<br>${p.price} TL</div>
<button onclick="del(${i})">Sil</button>
</div>`;
});

document.getElementById("total").innerText="Toplam: "+sum+" TL";
}

function del(i){
cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
render();
}

function go(){
location.href="checkout.html";
}

render();
</script>

</body>
</html>
